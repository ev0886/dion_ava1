[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dion-aba1"
version = "0.1.0"
description = "Control software for DION ABA1 vending machine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyserial>=3.5,<4.0",
    "pytest>=8.0,<9.0",
    "sqlalchemy>=2.0.36,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -p no:tmpdir"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]
