<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DION ABA1 Operator UI</title>
  <link rel="stylesheet" href="/ui-assets/operator.css">
</head>
<body>
  <main class="operator-shell" data-role="operator">
    <header class="operator-header">
      <div class="operator-header-copy">
        <p class="operator-kicker">DION ABA1</p>
        <h1 class="operator-title">Оператор</h1>
        <p class="visually-hidden">Навигация оператора по ячейкам</p>
        <p class="visually-hidden">4 сектора / 120 ячеек</p>
      </div>
      <p class="operator-summary" id="operator-summary">Секторы 1-8 • Ячейки 1-120</p>
    </header>

    <section class="operator-board operator-view is-active" id="operator-board-view" aria-labelledby="cells-title">
      <div class="board-topline">
        <p class="selection-summary" id="selection-summary">Выбрано: 0</p>
        <p class="status-message" id="status-message">Выберите ячейки</p>
      </div>

      <div class="sector-grid" id="sector-grid" role="list" aria-label="Секторы текущей четверти"></div>

      <div class="matrix-wrap">
        <h2 class="visually-hidden" id="cells-title">Матрица ячеек</h2>
        <div class="cells-grid" id="cells-grid" role="grid" aria-labelledby="cells-title"></div>
      </div>

      <div class="quarter-nav" aria-label="Навигация по четвертям барабана">
        <button class="quarter-button" id="quarter-prev" type="button" aria-label="Предыдущая четверть">&#8249;</button>
        <p class="quarter-indicator" id="quarter-indicator">1/4</p>
        <button class="quarter-button" id="quarter-next" type="button" aria-label="Следующая четверть">&#8250;</button>
      </div>
    </section>

    <section class="operator-board operator-view confirmation-view" id="operator-confirmation-view" aria-labelledby="confirmation-title" hidden>
      <div class="confirmation-card">
        <p class="confirmation-kicker" id="confirmation-kicker">Подтверждение</p>
        <h2 class="confirmation-title" id="confirmation-title">Подтвердите действие</h2>
        <div class="confirmation-details">
          <div class="confirmation-row">
            <span class="confirmation-label">Операция</span>
            <strong class="confirmation-value" id="confirmation-action">-</strong>
          </div>
          <div class="confirmation-row">
            <span class="confirmation-label">Выбрано</span>
            <strong class="confirmation-value" id="confirmation-count">0</strong>
          </div>
        </div>
        <div class="confirmation-cells-block">
          <p class="confirmation-label confirmation-cells-title">Ячейки</p>
          <div class="confirmation-cells" id="confirmation-cells" aria-live="polite"></div>
        </div>
        <p class="confirmation-note" id="confirmation-note" hidden>Действие подтверждено</p>
      </div>
    </section>

    <footer class="operator-actions">
      <div class="action-group operator-view is-active" id="operator-actions-main">
        <button class="action-button action-button-primary" id="remove-button" type="button">Изъять</button>
        <button class="action-button action-button-secondary" id="refill-button" type="button">Пополнить</button>
        <a class="action-button action-button-exit" href="/ui/user">Выход</a>
      </div>
      <div class="action-group operator-view confirmation-actions" id="operator-actions-confirmation" hidden>
        <button class="action-button action-button-back" id="confirmation-back-button" type="button">Назад</button>
        <button class="action-button action-button-confirm" id="confirmation-confirm-button" type="button">Подтвердить</button>
      </div>
    </footer>
  </main>

  <script>
    window.DION_OPERATOR_UI_CONFIG = __DION_OPERATOR_UI_CONFIG__;
  </script>
  <script src="/ui-assets/operator.js"></script>
</body>
</html>
