<!doctype html>
<html lang="ru">
<head>

  <title>DION ABA1 User UI</title>
  <link rel="stylesheet" href="/ui-assets/mvp.css">

<body>

    <section class="screen-card">
      <header class="screen-header">
        <p class="eyebrow">DION ABA1</p>

      <section class="screen-body" aria-live="polite">
        <p id="screen-kicker" class="screen-kicker hidden"></p>
        <h1 id="screen-title" class="screen-title"></h1>
        <p id="screen-message" class="screen-message hidden"></p>

        <div id="countdown-panel" class="countdown-panel hidden">
          <span class="countdown-label">&#1042;&#1086;&#1079;&#1074;&#1088;&#1072;&#1090; &#1095;&#1077;&#1088;&#1077;&#1079;</span>
          <strong id="countdown-value" class="countdown-value">0</strong>
        </div>
      </section>

      <section
        id="screen-actions"
        class="screen-actions"
        aria-label="&#1044;&#1077;&#1081;&#1089;&#1090;&#1074;&#1080;&#1103; &#1101;&#1082;&#1088;&#1072;&#1085;&#1072;"
      ></section>
    </section>
  </main>

  <script>
    window.DION_UI_CONFIG = __DION_UI_CONFIG__;
  </script>
  <script src="/ui-assets/mvp.js"></script>
</body>
</html>
